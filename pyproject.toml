[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zabbix-action-audit"
version = "0.1.0"
description = "Audit of Zabbix trigger actions: matched problems, recipient access, media and severities"
requires-python = ">=3.10"
dependencies = ["requests>=2.25", "jinja2>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
zabbix-action-audit = "zabbix_action_audit.cli:main"

[tool.setuptools.packages.find]
include = ["zabbix_action_audit*"]

[tool.setuptools.package-data]
"zabbix_action_audit.report" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests against a live Zabbix (192.168.88.40 and/or the 6.0 docker stand)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py310"
